name: Verify Dither
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build
      - run: node scripts/check-gif-worker.cjs
      - run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - run: node scripts/check-precise-export.mjs --interlace --artistic --all-effects
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: dither-static-build
          path: build/
