<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply saved appearance before the first paint, including browser chrome.
      (() => {
        let preference = "system";
        try { preference = JSON.parse(localStorage.getItem("dither.theme.v2")) || "system"; } catch {}
        const dark = preference === "dark" ||
          (preference !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#1d2026" : "#ffffff";
      })();
    </script>
    <meta
      name="description"
      content="Dither Studio by etovo. Craft video and image treatments with screenprint, contour type, color echoes, dithers, and precise local exports."
    />
    <title>Dither Studio — by etovo</title>
  </head>
  <body>
    <noscript>Dither needs JavaScript to process your media locally.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
